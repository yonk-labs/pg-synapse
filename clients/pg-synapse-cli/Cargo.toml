[package]
name = "pg-synapse-cli"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command line client for pg_synapse: run agents and named questions against your own Postgres"
repository = "https://github.com/yonk-labs/pg-synapse"

[[bin]]
name = "pg-synapse"
path = "src/main.rs"

[dependencies]
tokio           = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres  = { version = "0.7", features = ["with-serde_json-1"] }
serde_json      = "1"
